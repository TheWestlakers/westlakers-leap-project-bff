spring.application.name=leap-bff
server.port=8081
spring.profiles.default=dev
spring.main.allow-bean-definition-overriding=true

jwt.shared-secret=my-super-secret-key-for-leap-bff

mybatis.configuration.map-underscore-to-camel-case=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.jedis.pool.max-active=${REDIS_MAX_ACTIVE}
spring.data.redis.jedis.pool.max-idle=${REDIS_MAX_IDLE}
spring.data.redis.jedis.pool.min-idle=${REDIS_MIN_IDLE}
spring.data.redis.jedis.pool.max-wait=${REDIS_MAX_WAIT}

# Live Prices Configuration
# Update interval: 3 seconds for real-time updates
# Rate limit calculation: 1 batch call every 3 sec = 1200 calls/hour
# With 5 tickers per batch = 6000 ticker updates/hour (well within 2000 API call limit)
live-prices.update-interval=3000
live-prices.consumer-refresh-interval=3000
