services:
  postgres:
    image: postgres:16
    container_name: postgres_oltp

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
        - "5432:5432"

    volumes:
        - postgres_data:/var/lib/postgresql/data

  postgres-olap:
    image: postgres:16
    container_name: postgres_olap

    environment:
      POSTGRES_DB: ${OLAP_POSTGRES_DB}
      POSTGRES_USER: ${OLAP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OLAP_POSTGRES_PASSWORD}

    ports:
        - "5433:5433"

    volumes:
        - postgres_olap_data:/var/lib/postgresql/data

volumes:
    postgres_data:
    postgres_olap_data:

