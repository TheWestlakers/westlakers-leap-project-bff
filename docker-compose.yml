services:
  postgres:
    image: postgres:16
    container_name: postgres_server

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
        - "5432:5432"

    volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
        - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql
        - ./init/01-init-olap.sql:/docker-entrypoint-initdb.d/03-init-olap-db.sql
        - ./init/02-init-olap.sh:/docker-entrypoint-initdb.d/04-init-olap.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  price-streamer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: price_streamer_service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      BATCH_SIZE: 50
      BATCHES_PER_CYCLE: 3
      BATCH_INTERVAL: 1.0
      CACHE_TTL: 3600
      TICKERS: ${TICKERS:-AAPL,MSFT,GOOGL,AMZN,TSLA,NFLX,NVDA,TSLA,AMD,INTC}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./analytics:/app/analytics
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: on-failure
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
    postgres_data:
    redis_data: